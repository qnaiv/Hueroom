name: CI / Pages

# PR: テスト → ビルド → 専用 URL にプレビューを公開（PR を閉じると自動で削除）
# main: テスト → ビルド → 本番（ルート）を更新
# どちらも gh-pages ブランチに置き、GitHub Pages の「ブランチから配信」で公開する
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # PR のプレビュー（https://<ユーザー名>.github.io/<リポジトリ名>/pr-preview/pr-<番号>/）
  preview:
    needs: [test]
    if: always() && github.event_name == 'pull_request' && (github.event.action == 'closed' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build && touch dist/.nojekyll
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist

  # main の本番（https://<ユーザー名>.github.io/<リポジトリ名>/）
  deploy:
    needs: [test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && touch dist/.nojekyll
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # PR のプレビューを消さない
          clean-exclude: pr-preview/
